<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NovaPharma Analytics Assistant</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div id="login-screen" class="screen">
  <div class="login-card">
    <h1>NovaPharma</h1>
    <p class="subtitle">Commercial Analytics Assistant</p>
    <form id="login-form">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" required
             placeholder="sarah.chen@novapharma.com">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button type="submit">Log in</button>
      <div id="login-error" class="error-banner" hidden></div>
    </form>
  </div>
</div>

<div id="chat-screen" class="screen" hidden>
  <header class="topbar">
    <div class="brand">NovaPharma Analytics Assistant</div>
    <div class="user-info">
      <span id="user-name"></span>
      <span id="user-role" class="badge"></span>
      <span id="user-scope" class="scope"></span>
      <label class="toggle">
        <input type="checkbox" id="show-sql-toggle"> Show SQL
      </label>
      <button id="logout-btn" class="link-btn">Log out</button>
    </div>
  </header>

  <main id="messages" class="messages"></main>

  <form id="chat-form" class="composer">
    <input id="chat-input" type="text" autocomplete="off"
           placeholder="Ask a question, e.g. &quot;What are my top 5 accounts this quarter?&quot;" required>
    <button type="submit">Send</button>
  </form>
</div>

<script src="/static/app.js"></script>
</body>
</html>
